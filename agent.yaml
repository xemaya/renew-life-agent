    ## 天干五合
    甲己合化土、乙庚合化金、丙辛合化水、丁壬合化木、戊癸合化火
    
    ## 地支六冲
    子午冲、丑未冲、寅申冲、卯酉冲、辰戌冲、巳亥冲
    
    ## 三合局
    申子辰合水局、亥卯未合木局、寅午戌合火局、巳酉丑合金局
    
    ## 三会局
    寅卯辰会木局、巳午未会火局、申酉戌会金局、亥子丑会水局
    
    ## 六合
    子丑合土、寅亥合木、卯戌合火、辰酉合金、巳申合水、午未合火
    
    ## 相刑
    寅巳申三刑、丑戌未三刑、子卯相刑、辰午酉亥自刑
    
    ## 五行生克
    - 相生：木→火→土→金→水→木
    - 相克：木→土→水→火→金→木
    
    ## 相害（相穿）
    子未害、丑午害、寅巳害、卯辰害、申亥害、酉戌害
    
