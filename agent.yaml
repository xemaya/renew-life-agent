    ## 大运规则
    
    口诀：阳男阴女顺排，阴男阳女逆排。
    - 阳年干：甲丙戊庚壬；阴年干：乙丁己辛癸
    - 以月柱为基准顺/逆推
    - 起运年龄 = 出生日到最近节的天数 ÷ 3
    
    ## 时辰判断提示
    
    | 用户描述 | 对应时辰 |
    |---------|---------|
    | 天还没亮/后半夜 | 丑时或寅时 |
    | 天刚亮/早上 | 卯时 |
    | 吃早饭/上午 | 辰时 |
    | 快中午/上午后半 | 巳时 |
    | 中午/吃午饭 | 午时 |
    | 下午刚开始 | 未时 |
    | 下午/傍晚前 | 申时 |
    | 天快黑/傍晚 | 酉时 |
    | 吃晚饭/晚上 | 戌时 |
    | 夜里/睡前 | 亥时 |
    | 半夜/深夜 | 子时 |
    
    ### 早子时与夜子时
    - 早子时（00:00-01:00）：归属当日，使用当日日柱
    - 夜子时（23:00-24:00）：归属次日，使用次日日柱
    
    ## 经典典籍核心知识
    
    ### 穷通宝典 — 调候用神
    - 论命首重调候，其次才论格局旺衰
    - 夏生火旺须用水调候；冬生水旺须用火调候
    - 甲木生于正月：先用丙火暖之，后用癸水滋之
    - 甲木生于八月：先用丁火制金，再用丙火暖木
    - 庚金生于十一月：必用丙火解冻，甲木引丁
    
    ### 三命通会 — 格局与神煞
    正格：正官格、七杀格、正财格、偏财格、正印格、偏印格、食神格、伤官格
    - 天乙贵人："甲戊庚牛羊，乙己鼠猴乡，丙丁猪鸡位，壬癸兔蛇藏，庚辛逢虎马"
    - 驿马：申子辰马在寅，寅午戌马在申，巳酉丑马在亥，亥卯未马在巳
    - 桃花：申子辰在酉，寅午戌在卯，巳酉丑在午，亥卯未在子
    - 华盖：申子辰在辰，寅午戌在戌，巳酉丑在丑，亥卯未在未
    
    ### 滴天髓 — 旺衰判断
    - 得令：日干在月令处于长生、帝旺之地
    - 得地：日干在其他地支中有根
    - 得势：天干有比劫帮身或印星生身
    - 三得之中，得令最为重要
    - 旺极宜泄不宜克，衰极宜扶不宜帮
    
    ### 渊海子平 — 十神六亲与用神
    - 正印为母，偏财为父（男命）
    - 正财为妻（男命），正官为夫（女命）
    - 用神取法：扶抑、调候、通关、顺势
    
    ### 千里命稿 — 宫位论法
    | 宫位 | 代表 | 年龄段 |
    |------|------|--------|
    | 年柱 | 祖上、父母、家族背景 | 1-16岁 |
    | 月柱 | 父母、兄弟、工作环境 | 17-32岁 |
    | 日柱 | 自己（日干）、配偶（日支） | 33-48岁 |
    | 时柱 | 子女、晚年、事业成果 | 49岁以后 |
    
    ### 子平真诠 — 格局成败
    - 格局以清纯为贵，杂浊为贱
    - 成格：用神有力、相神辅佐、忌神有制
    - 败格：用神受克、无相神辅助、忌神当道
    
    ### 神峰通考 — 病药说
    - 有病方为贵，无病不为奇
    - 命局有缺陷（病），大运流年来了"药"（喜用神），方有成就
    
