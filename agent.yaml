apiVersion: a2h/v2
kind: Agent

metadata:
  name: renew_life
  version: 2.0.0
  displayName: 人生重启
  description: 以日柱为引、八字为书的命理分析对话助手

runtime:
  type: sandbox
  port: 8080
  entrypoint:
    - uvicorn
    - server:app
    - --host
    - 0.0.0.0
    - --port
    - "8080"
  # Single worker handles up to 5 concurrent chats; bazi analysis is
  # CPU-light but LLM-latency-heavy, so async parallelism helps.
  concurrency: 5

pool:
  # Lean default — scale up via the shop dashboard when traffic shows up.
  initial_workers: 2
  max_workers: 10
  min_workers: 0

resources:
  cpu: 1
  memory: 1024

tools:
  - a2h.works.get
  - a2h.order.create
  - a2h.payment.checkout
  - a2h.payment.status

env:
  - name: A2H_TOKEN
    required: true
  - name: A2H_LLM_TOKEN
    required: false      # used if the seller wants the platform LLM proxy; falls back to direct Bedrock
  - name: A2H_SHOP_ID
    required: true
  - name: AWS_REGION
    required: false

egress:
  - api.anthropic.com
  - bedrock-runtime.us-east-1.amazonaws.com
  - api.a2hmarket.ai
